<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="beachSky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#be185d"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="sunGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#beachSky2)"/>

  <!-- Sun -->
  <circle cx="600" cy="460" r="160" fill="url(#sunGlow2)"/>

  <!-- Ocean Waves -->
  <rect x="0" y="500" width="1200" height="400" fill="#0369a1"/>
  <ellipse cx="600" cy="560" rx="280" ry="25" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="600" cy="620" rx="380" ry="30" fill="#f97316" opacity="0.4"/>

  <!-- Sandy Shoreline -->
  <path d="M0 680 Q 400 620, 800 690 T 1200 660 L 1200 900 L 0 900 Z" fill="#78350f"/>
  <path d="M0 730 Q 500 680, 1200 720 L 1200 900 L 0 900 Z" fill="#451a03"/>

  <!-- Heart drawn in the sand with golden glow -->
  <path d="M 600 780 C 600 760, 560 740, 540 760 C 510 790, 560 830, 600 850 C 640 830, 690 790, 660 760 C 640 740, 600 760, 600 780 Z" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.85"/>

  <!-- Couple Silhouette Leaning Together Smiling on the Shore -->
  <!-- Man on left putting arm around her -->
  <circle cx="490" cy="580" r="28" fill="#0f172a"/>
  <path d="M 440 680 Q 460 610 490 610 Q 520 610 540 680 Z" fill="#0f172a"/>
  <!-- Girlfriend with sundress and hair blowing in sea breeze -->
  <circle cx="535" cy="590" r="25" fill="#0f172a"/>
  <!-- Hair strands in wind -->
  <path d="M 520 575 Q 560 560 580 590 Q 590 630 570 660 Z" fill="#0f172a"/>
  <!-- Dress leaning into his shoulder -->
  <path d="M 515 680 Q 530 615 545 615 Q 570 630 585 680 Z" fill="#0f172a"/>

  <!-- Warm Sun Flare over couple -->
  <circle cx="520" cy="610" r="80" fill="#fef08a" opacity="0.25" filter="blur(15px)"/>

  <!-- Memory Card Border -->
  <rect x="30" y="30" width="1140" height="840" rx="20" fill="none" stroke="rgba(253, 230, 138, 0.4)" stroke-width="2"/>
  <rect x="42" y="42" width="1116" height="816" rx="14" fill="none" stroke="rgba(253, 230, 138, 0.2)" stroke-width="1"/>

  <!-- Bottom Caption Badge -->
  <rect x="360" y="780" width="480" height="70" rx="35" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(253, 230, 138, 0.5)" stroke-width="1.5"/>
  <text x="600" y="822" fill="#fef08a" font-family="serif" font-size="24" font-weight="300" text-anchor="middle" letter-spacing="3">BEACH DAY • SUMMER WITH YOU</text>
</svg>