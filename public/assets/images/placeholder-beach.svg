<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="beachSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#be185d"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="90%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="30%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#beachSky)"/>
  <!-- Sun -->
  <circle cx="600" cy="420" r="140" fill="url(#sunGlow)"/>
  <!-- Ocean -->
  <rect x="0" y="440" width="1200" height="360" fill="url(#oceanGrad)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="600" cy="500" rx="90" ry="12" fill="#fff" opacity="0.6"/>
  <ellipse cx="600" cy="540" rx="140" ry="15" fill="#fef08a" opacity="0.5"/>
  <ellipse cx="600" cy="590" rx="200" ry="18" fill="#f97316" opacity="0.4"/>
  <ellipse cx="600" cy="650" rx="260" ry="22" fill="#fdba74" opacity="0.3"/>
  <!-- Shore curve -->
  <path d="M0 680 Q 400 620, 800 690 T 1200 660 L 1200 800 L 0 800 Z" fill="#78350f" opacity="0.85"/>
  <path d="M0 720 Q 500 670, 1200 710 L 1200 800 L 0 800 Z" fill="#451a03"/>
  <!-- Couple silhouette sitting on beach shore -->
  <ellipse cx="780" cy="670" rx="14" ry="14" fill="#0f172a"/>
  <ellipse cx="806" cy="672" rx="13" ry="13" fill="#0f172a"/>
  <path d="M 765 720 Q 770 680 782 680 Q 795 680 798 720 Z" fill="#0f172a"/>
  <path d="M 795 720 Q 800 683 808 683 Q 820 683 825 720 Z" fill="#0f172a"/>
  <!-- Flying birds -->
  <path d="M300 200 Q315 190 330 200 Q345 190 360 200 Q345 208 330 200 Q315 208 300 200 Z" fill="#0f172a" opacity="0.7"/>
  <path d="M380 230 Q392 222 405 230 Q418 222 430 230 Q418 236 405 230 Q392 236 380 230 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Title Badge in bottom left -->
  <rect x="50" y="50" width="300" height="60" rx="30" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(253, 230, 138, 0.4)" stroke-width="1.5"/>
  <text x="200" y="86" fill="#fef08a" font-family="serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="3">BEACH MEMORY</text>
</svg>