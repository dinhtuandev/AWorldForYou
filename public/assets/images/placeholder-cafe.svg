<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cafeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cafeBg)"/>
  <!-- Window to rainy street -->
  <rect x="650" y="100" width="480" height="420" rx="12" fill="url(#windowNight)" stroke="#3f3f46" stroke-width="8"/>
  <!-- Rain streaks & street lights outside -->
  <circle cx="800" cy="240" r="28" fill="#fbbf24" opacity="0.3" filter="blur(8px)"/>
  <circle cx="980" cy="320" r="35" fill="#f43f5e" opacity="0.25" filter="blur(10px)"/>
  <circle cx="720" cy="380" r="22" fill="#38bdf8" opacity="0.3" filter="blur(6px)"/>
  <!-- Rain lines -->
  <path d="M 700 120 L 680 180 M 760 140 L 740 220 M 850 110 L 830 200 M 920 160 L 900 240 M 1020 130 L 1000 210 M 740 300 L 720 400 M 890 280 L 870 380 M 980 320 L 960 420" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
  <!-- Window frame cross -->
  <line x1="890" y1="100" x2="890" y2="520" stroke="#3f3f46" stroke-width="6"/>
  <line x1="650" y1="310" x2="1130" y2="310" stroke="#3f3f46" stroke-width="6"/>
  <!-- Warm Pendant Lamp -->
  <circle cx="340" cy="180" r="160" fill="url(#lampGlow)"/>
  <path d="M340 0 L 340 100" stroke="#a1a1aa" stroke-width="3"/>
  <path d="M290 130 Q 340 80 390 130 Z" fill="#71717a"/>
  <!-- Wooden Table -->
  <ellipse cx="450" cy="680" rx="420" ry="180" fill="#78350f" stroke="#451a03" stroke-width="12"/>
  <!-- Two Coffee Cups with Steam -->
  <!-- Cup 1 -->
  <rect x="360" y="580" width="70" height="65" rx="10" fill="#fef3c7"/>
  <ellipse cx="395" cy="580" rx="35" ry="10" fill="#78350f"/>
  <path d="M 430 595 Q 450 610 430 625" fill="none" stroke="#fef3c7" stroke-width="6"/>
  <!-- Cup 2 -->
  <rect x="490" y="590" width="70" height="65" rx="10" fill="#fef3c7"/>
  <ellipse cx="525" cy="590" rx="35" ry="10" fill="#78350f"/>
  <path d="M 560 605 Q 580 620 560 635" fill="none" stroke="#fef3c7" stroke-width="6"/>
  <!-- Steam curves -->
  <path d="M 395 560 Q 380 520 400 480 T 395 430" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
  <path d="M 525 570 Q 540 530 520 490 T 525 440" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
  <!-- Title Badge -->
  <rect x="50" y="50" width="280" height="60" rx="30" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(253, 230, 138, 0.4)" stroke-width="1.5"/>
  <text x="190" y="86" fill="#fef08a" font-family="serif" font-size="22" font-weight="300" text-anchor="middle" letter-spacing="3">COZY CAFE</text>
</svg>