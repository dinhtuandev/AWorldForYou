<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="firstBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31103f" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fda4af" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Romantic Sunset / Twilight Sky -->
  <rect width="800" height="600" fill="url(#firstBg)" />

  <!-- Soft Central Halo Glow -->
  <circle cx="400" cy="240" r="260" fill="url(#sparkGlow)" />

  <!-- Blossom Tree Silhouette -->
  <!-- Trunk -->
  <path d="M 160,500 Q 180,380 140,280 Q 130,220 100,160" stroke="#180426" stroke-width="18" fill="none" stroke-linecap="round" />
  <path d="M 140,280 Q 200,240 260,200" stroke="#180426" stroke-width="10" fill="none" stroke-linecap="round" />
  <path d="M 160,340 Q 120,300 80,290" stroke="#180426" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Pink Cherry Blossoms -->
  <circle cx="100" cy="150" r="30" fill="#f472b6" opacity="0.8" />
  <circle cx="140" cy="130" r="25" fill="#fda4af" opacity="0.85" />
  <circle cx="200" cy="180" r="35" fill="#f472b6" opacity="0.75" />
  <circle cx="260" cy="190" r="28" fill="#fda4af" opacity="0.8" />
  <circle cx="70" cy="280" r="22" fill="#fb7185" opacity="0.7" />

  <!-- Park Bench Silhouette -->
  <path d="M 340,460 L 460,460" stroke="#1e1b4b" stroke-width="8" stroke-linecap="round" />
  <path d="M 350,430 L 450,430" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" />
  <line x1="360" y1="430" x2="360" y2="495" stroke="#1e1b4b" stroke-width="5" />
  <line x1="440" y1="430" x2="440" y2="495" stroke="#1e1b4b" stroke-width="5" />

  <!-- Floating Sparkles / Petals -->
  <circle cx="390" cy="220" r="4" fill="#ffffff" />
  <circle cx="420" cy="260" r="3" fill="#fef08a" />
  <circle cx="340" cy="290" r="2.5" fill="#fda4af" />
  <circle cx="460" cy="210" r="3.5" fill="#ffffff" />
  <circle cx="410" cy="170" r="2" fill="#fed7aa" />

  <!-- Park Grass Mound -->
  <path d="M 0,485 Q 400,450 800,485 L 800,600 L 0,600 Z" fill="#0f0728" />

  <!-- Label Overlay Card -->
  <rect x="250" y="525" width="300" height="48" rx="24" fill="#180426" opacity="0.8" stroke="#f43f5e" stroke-width="1" />
  <text x="400" y="555" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="300" letter-spacing="3">FIRST SPARK MEMORY</text>
</svg>
